name: Pricing regression tests
on:
  push:
    branches: [main]
    paths:
      - 'pricing.js'
      - 'tests/**'
      - '.github/workflows/pricing-tests.yml'
  pull_request:
    paths:
      - 'pricing.js'
      - 'tests/**'
      - '.github/workflows/pricing-tests.yml'
permissions:
  contents: read
jobs:
  pricing:
    name: Node.js calculation checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run pricing regression tests
        run: node --test tests/pricing-regression.test.mjs
